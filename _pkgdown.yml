url: https://hdbt.github.io/metrodag/
destination: _site
template:
  bootstrap: 5
  bslib:
    # Colours taken from the hex logo (data-raw/logo.R).
    primary: "#1F6FB2"
    dark: "#1F2A36"
    body-color: "#1F2A36"
    headings-color: "#1F2A36"
    link-color: "#1F6FB2"
    border-radius: 0.6rem
    base_font: {google: "Inter"}
    heading_font: {google: "Inter"}
    code_font: {google: "JetBrains Mono"}
    code-bg: "#F3F6F9"
development:
  mode: release
home:
  title: Publication-oriented causal DAGs in R
  description: >
    Create, annotate, compare, and export causal diagrams with deterministic
    layouts and readable publication figures.
navbar:
  bg: dark
  type: dark
  structure:
    left: [intro, reference, articles, news]
    right: [search, github]
articles:
  - title: Research workflows
    navbar: Guides
    contents:
      - metrodag
      - analysis-views
      - publication
  - title: Technical background
    navbar: Technical background
    contents:
      - algorithm
reference:
  - title: Create and draw a DAG
    desc: Start with a graph, then reuse its layout when needed.
    contents:
      - metro_dag
      - metro_graph
      - metro_graph_from_adjacency
      - layout_metro_dag
      - plot_metro_dag
      - metro_style
      - metrodag_examples
  - title: Compare analyses and check adjustment
    desc: >
      Show several analyses on one fixed geometry, and test adjustment sets
      with the optional dagitty package.
    contents:
      - compare_metro_dags
      - check_metro_adjustment
      - highlight_paths
  - title: Inspect and export figures
    desc: >
      Check a figure at its printed size, export it at journal widths, compose
      it with other plots, and quantify the layout.
    contents:
      - diagnose_metro_dag
      - save_metro_dag
      - as_metro_grob
      - layout_metrics
      - count_crossings
  - title: Package
    desc: Workflow overview and how metrodag differs from other DAG tools.
    contents:
      - metrodag-package
figures:
  # Not svglite: pkgdown 2.2 always saves reference figures with bg = NA,
  # which svglite rejects. The cairo SVG device accepts it and draws text as
  # outlines in the font it measured, so labels cannot overflow in a browser.
  dev: grDevices::svg
  fig.ext: svg
  bg: white
  dpi: 120
  fig.width: 7
  fig.height: 5
