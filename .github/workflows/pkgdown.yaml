name: Documentation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the built documentation from main to GitHub Pages
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    outputs:
      pages: ${{ steps.pages.outcome }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v6
      # Liberation Sans has Arial's metrics. svglite names "Arial" for the
      # "sans" family, so label sizes measured here match what browsers draw.
      - name: Install Arial-compatible fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-liberation
          fc-cache -f
          fc-match Arial
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::pkgdown
            any::dagitty
            any::svglite
          needs: website
      - name: Build website and execute examples
        shell: bash
        run: |
          site_source=$(mktemp -d)
          trap 'rm -rf "$site_source"' EXIT
          git archive HEAD | tar -x -C "$site_source" --exclude=DEVELOPMENT.md --exclude=ROADMAP.md --exclude=paper.md --exclude=paper.bib
          (
            cd "$site_source"
            Rscript -e 'pkgdown::build_site(devel = FALSE, new_process = FALSE, preview = FALSE)'
          )
          mv "$site_source/_site" _site
      - name: Upload website for review
        uses: actions/upload-artifact@v4
        with:
          name: metrodag-documentation
          path: _site
          if-no-files-found: error
      - name: Check GitHub Pages configuration
        if: github.repository == 'hdbt/metrodag' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || inputs.publish)
        id: pages
        uses: actions/configure-pages@v5
        continue-on-error: ${{ github.event_name == 'push' }}
      - name: Prepare Pages artifact
        if: steps.pages.outcome == 'success'
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    if: needs.build.outputs.pages == 'success'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy documentation
        id: deployment
        uses: actions/deploy-pages@v4
